# Winthistle regtest harness: one bitcoind, one "our" LND node (alice) and three
# peers. Batch sizes up to n=3 are testable; comment out dave for a lighter run.
#
# Data lives in named volumes rather than bind mounts, deliberately: it dodges
# the uid-mismatch trap and it keeps this file usable against a remote daemon
# (docker context create --docker host=ssh://...). Credentials are lifted out
# with `make creds` instead.
name: winthistle-regtest

# Lightning Labs' own image, not Polar's: Polar publishes no tag past
# 0.20.0-beta, and the harness has to run the LND an operator actually runs. It
# differs from Polar's in three ways that this file has to absorb — its
# entrypoint is `lnd` itself, so `command` carries flags and not the binary name;
# it runs as root with its data in /root/.lnd rather than as `lnd` in
# /home/lnd/.lnd; and it has no USERID/GROUPID entrypoint shim, which costs
# nothing here because the state lives in named volumes.
x-lnd: &lnd
  image: lightninglabs/lnd:${LND_VERSION}
  restart: unless-stopped
  depends_on:
    bitcoind:
      condition: service_healthy
    chain-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "lncli --network=regtest --lnddir=/root/.lnd getinfo >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 40
    start_period: 10s

services:
  bitcoind:
    image: polarlightning/bitcoind:${BITCOIND_VERSION}
    container_name: wt-bitcoind
    restart: unless-stopped
    environment:
      USERID: ${USERID}
      GROUPID: ${GROUPID}
    command: >-
      bitcoind
      -server=1
      -regtest=1
      -rpcbind=0.0.0.0
      -rpcallowip=0.0.0.0/0
      -rpcport=18443
      -rpcuser=${RPCUSER}
      -rpcpassword=${RPCPASS}
      -txindex=1
      -listen=1
      -listenonion=0
      -dnsseed=0
      -upnp=0
      -fallbackfee=0.0002
      -zmqpubrawblock=tcp://0.0.0.0:28334
      -zmqpubrawtx=tcp://0.0.0.0:28335
    ports:
      - "18443:18443"
    volumes:
      - bitcoind:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=${RPCUSER} -rpcpassword=${RPCPASS} getblockchaininfo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Runs once per `up`, then exits. Idempotent: only mines if the chain is short.
  chain-init:
    image: polarlightning/bitcoind:${BITCOIND_VERSION}
    container_name: wt-chain-init
    restart: "no"
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      RPCUSER: ${RPCUSER}
      RPCPASS: ${RPCPASS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BC="bitcoin-cli -regtest -rpcconnect=bitcoind -rpcport=18443 -rpcuser=$$RPCUSER -rpcpassword=$$RPCPASS"
        $$BC -named createwallet wallet_name=miner descriptors=true >/dev/null 2>&1 \
          || $$BC loadwallet miner >/dev/null 2>&1 || true
        H=$$($$BC getblockcount)
        if [ "$$H" -lt 101 ]; then
          A=$$($$BC -rpcwallet=miner getnewaddress)
          $$BC generatetoaddress $$((101 - H)) "$$A" >/dev/null
        fi
        echo "chain-init: height $$($$BC getblockcount)"

  # alice is "our" node — the one Winthistle drives.
  alice:
    <<: *lnd
    container_name: wt-alice
    command: --alias=alice --tlsextradomain=alice --externalip=alice ${LND_FLAGS}
    ports:
      - "10009:10009"
      - "8080:8080"
    volumes:
      - alice:/root/.lnd

  bob:
    <<: *lnd
    container_name: wt-bob
    command: --alias=bob --tlsextradomain=bob --externalip=bob ${LND_FLAGS}
    ports:
      - "10010:10009"
    volumes:
      - bob:/root/.lnd

  carol:
    <<: *lnd
    container_name: wt-carol
    command: --alias=carol --tlsextradomain=carol --externalip=carol ${LND_FLAGS}
    ports:
      - "10011:10009"
    volumes:
      - carol:/root/.lnd

  dave:
    <<: *lnd
    container_name: wt-dave
    command: --alias=dave --tlsextradomain=dave --externalip=dave ${LND_FLAGS}
    ports:
      - "10012:10009"
    volumes:
      - dave:/root/.lnd

volumes:
  bitcoind:
  alice:
  bob:
  carol:
  dave:
